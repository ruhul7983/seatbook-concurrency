services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: seatbook
      POSTGRES_PASSWORD: seatbook
      POSTGRES_DB: seatbook
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbook"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Holds seat locks only. No ports: reachable from the server over the compose network, not from the host.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  server:
    build: ./server
    environment:
      DATABASE_URL: postgresql://seatbook:seatbook@db:5432/seatbook
      REDIS_URL: redis://redis:6379
      PORT: 4000
      # Set JWT_SECRET in your shell or a root .env file to choose the secret. Left unset, the server
      # generates a random one into JWT_SECRET_FILE on first start and keeps it in the server-secrets
      # volume, so logins survive restarts and no secret is committed to git.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_SECRET_FILE: /app/secrets/jwt-secret
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - server-secrets:/app/secrets

  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:4000
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src

volumes:
  db-data:
  redis-data:
  server-secrets:
